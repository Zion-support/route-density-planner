<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Route Density Planner</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}input{padding:.5rem;width:100px}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🗺️ Route Density Planner</h1><p>Estimate savings from route clustering.</p><label>Jobs/day: <input id="j" type="number" value="12"></label> <label>Techs: <input id="t" type="number" value="4"></label> <label>Avg km between jobs: <input id="k" type="number" value="25"></label> <button onclick="go()">Plan</button><div id="out"></div><script>function go(){const j=+document.getElementById('j').value,t=+document.getElementById('t').value,k=+document.getElementById('k').value;const save=Math.round(j*k*0.22),hrs=(j*k*0.22/45).toFixed(1);document.getElementById('out').textContent=`Optimized clusters: ${Math.ceil(j/4)} zones\nKm saved/day: ${save} km (~${hrs} driving hours)\nMonthly fuel savings: ~$${(save*22*0.09).toFixed(0)}\nExtra job capacity: +${Math.floor(j*0.15)} jobs/day\n\nFull deployment: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/route-density-planner">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-field-dispatch/">Field Dispatch</a></p></body></html>
